services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed

    environment:
      MYSQL_ROOT_PASSWORD: "123"

    volumes:
      - mariadb-data:/var/lib/mysql

    networks:
      - frappe-network

  redis:
    image: redis:alpine
    restart: unless-stopped

    networks:
      - frappe-network

  frappe:
    image: frappe/bench:latest
    restart: unless-stopped

    command:
      - bash
      - /workspace/init.sh

    environment:
      SHELL: /bin/bash
      FRAPPE_BIND_ADDR: 0.0.0.0

    working_dir: /home/frappe

    volumes:
      - ./docker:/workspace
      - frappe-home-data:/home/frappe

    ports:
      - "8000:8000"
      - "9000:9000"

    depends_on:
      - mariadb
      - redis

    networks:
      - frappe-network

  mcp:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      FRAPPE_MCP_MODE: production
      FRAPPE_BASE_URL: http://frappe:8000
      FRAPPE_API_KEY: ${FRAPPE_API_KEY}
      FRAPPE_API_SECRET: ${FRAPPE_API_SECRET}
      PORT: 8800

    expose:
      - "8800"

    depends_on:
      - frappe

    networks:
      - frappe-network

  mcp-gateway:
    image: nginx:alpine
    container_name: frappe-mcp-gateway
    restart: unless-stopped

    ports:
      - "8800:8800"

    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}

    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro

    depends_on:
      - mcp

    networks:
      - frappe-network
  
  strands-api:
    build:
      context: ../Strands-for-HR-Management-System
      dockerfile: Dockerfile

    container_name: strands-hr-api
    restart: unless-stopped

    environment:
      # Required by the Strands Mistral model
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      FRAPPE_MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}

      # MCP gateway address inside the Docker network
      FRAPPE_MCP_URL: http://mcp-gateway:8800/mcp

      # Employee search and workflow settings
      MCP_EMPLOYEE_QUERY: "*"
      LOW_LEAVE_THRESHOLD_DAYS: "2.0"
      LOW_LEAVE_THRESHOLD_RATIO: "0.15"
      HITL_ENABLED: "true"
      BYPASS_TOOL_CONSENT: "true"

      # Email API is exposed by this same FastAPI application
      EMAIL_API_BASE_URL: http://127.0.0.1:8001

    ports:
      - "8001:8001"

    expose:
      - "8001"

    depends_on:
      - mcp-gateway

    networks:
      - frappe-network

networks:
  frappe-network:
    driver: bridge

volumes:
  mariadb-data:
  frappe-home-data: