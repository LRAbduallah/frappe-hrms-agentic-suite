server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://strands-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        if ($cookie_hr_agent_session = "") {
            return 401;
        }
        proxy_pass http://strands-api:8001;
        proxy_http_version 1.1;
        proxy_set_header X-API-Key "${AGENT_API_KEY}";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://strands-api:8001;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://strands-api:8001;
        proxy_set_header Host $host;
    }

    location /workflows {
        if ($cookie_hr_agent_session = "") {
            return 401;
        }
        proxy_pass http://strands-hr-workflow:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
